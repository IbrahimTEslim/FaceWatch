<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FaceWatch{% block title %}{% endblock %}</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/main.css') }}">
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/chartjs-plugin-annotation@3.0.1/dist/chartjs-plugin-annotation.min.js"></script>
  <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
</head>
<body>

<nav class="nav">
  <a class="nav-logo" href="/">⬡ FaceWatch</a>
  <div class="nav-links">
    <a class="nav-link {% if request.path == '/' %}active{% endif %}" href="/">Dashboard</a>
    <a class="nav-link {% if request.path == '/history' %}active{% endif %}" href="/history">History</a>
  </div>
  <div class="nav-right">
    {% block nav_right %}{% endblock %}
  </div>
</nav>

{% block body %}{% endblock %}

<script src="{{ url_for('static', filename='js/charts.js') }}"></script>
{% block scripts %}{% endblock %}
</body>
</html>
